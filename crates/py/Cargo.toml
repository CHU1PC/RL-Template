[package]
name = "rl-py"
edition.workspace = true
version.workspace = true

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module"] }
rl-core = { version = "0.1.0", path = "../core" }

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
pyo3-build-config = "0.29.2"
